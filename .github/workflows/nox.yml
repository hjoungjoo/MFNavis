name: nox
# Run on pushes to the long-lived branches and on pull requests. Restricting
# `push` to main/release means a push to a feature branch with an open PR only
# triggers the `pull_request` run (not also a `push` run), so a PR gets a single
# run per push instead of two.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release
  pull_request:
jobs:
  nox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Retain the full Bookworm compatibility suite. Trixie checks run below;
        # its hardware runtime requires the arm64 INDI archive and OS packages.
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Install pinned MFDS release
        uses: ./.github/actions/install-mfds
      - name: Create tetra3 import alias
        run: bash ../scripts/ensure_tetra3_link.sh ..
      - name: Check Cedar-free merge candidate
        run: python3 ../scripts/check_cedar_free.py --repo ..
      - name: Verify installed MFDS package
        run: bash ../scripts/setup_mfds.sh
      - uses: actions/setup-python@v6
        with:
          # Do not rely on the runner's preinstalled Python: its version can
          # change independently of this workflow.
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements_dev.txt
      - name: Install pinned Nox
        run: python -m pip install --disable-pip-version-check nox==2024.4.15
      - name: Run Nox on Python ${{ matrix.python-version }}
        env:
          NOX_PYTHON: ${{ matrix.python-version }}
        # Keep the interpreter-specific environment directory explicit so a
        # runner image update cannot reuse an incompatible virtual environment.
        run: >-
          python -m nox --error-on-missing-interpreters
          --envdir .nox-${{ matrix.python-version }}
          -s lint format type_hints smoke_tests unit_tests ui_tests

  trixie-checks:
    name: Trixie Python 3.13 quality and installer checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements_docs-trixie.txt
      - name: Install pinned check tools
        run: python -m pip install --disable-pip-version-check nox==2024.4.15 pytest==8.4.2
      - name: Check code and build Trixie documentation
        env:
          NOX_PYTHON: "3.13"
        run: >-
          python -m nox --error-on-missing-interpreters
          --envdir .nox-3.13 -s lint format docs
      - name: Check archive compatibility and runtime setup
        # These tests mock installation and need no Pi hardware or local wheels.
        run: >-
          python -m pytest -q
          tests/test_indi_archive_platform.py
          tests/test_indi_archive_verification.py
          tests/test_setup_indi_archive.py
