name: Checkout pinned MF detector
description: Read public MFDS at the application's exact gitlink commit
runs:
  using: composite
  steps:
    - name: Read pinned revision
      id: revision
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        entry=$(git ls-tree HEAD -- python/mf_detect_star)
        read -r mode kind revision path <<< "$entry"
        test "$mode" = 160000
        test "$kind" = commit
        echo "sha=$revision" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v5
      with:
        repository: hjoungjoo/MFDS
        ref: ${{ steps.revision.outputs.sha }}
        path: python/mf_detect_star
        persist-credentials: false
